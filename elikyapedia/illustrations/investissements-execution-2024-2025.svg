<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title desc"><title id="title">Exécution budgétaire : courant et capital</title><desc id="desc">Budget général. 2024 : courant 114,12 %, capital 50,54 %. 2025 : courant 107,76 %, capital 44,56 %.</desc><rect width="800" height="520" fill="#faf9f6"/><style>text{font-family:Arial,sans-serif;fill:#27382c}</style><text x="40" y="35" font-size="13" letter-spacing="2">ELIKYAPEDIA / INVESTISSEMENT PUBLIC</text><text x="40" y="70" font-size="25" font-weight="bold">Exécution budgétaire : courant et capital</text><text x="40" y="101" font-size="16">Paiements / crédits de référence · Budget général du pouvoir central</text><rect x="80" y="126" width="14" height="14" fill="#476654"/><text x="103" y="138" font-size="14">Dépenses courantes</text><rect x="345" y="126" width="14" height="14" fill="#842f38"/><text x="368" y="138" font-size="14">Dépenses en capital</text><path d="M80,405.0H740" stroke="#d8ddd5"/><text x="25" y="410.0" font-size="14">0 %</text><path d="M80,369.0H740" stroke="#d8ddd5"/><text x="25" y="374.0" font-size="14">20 %</text><path d="M80,333.0H740" stroke="#d8ddd5"/><text x="25" y="338.0" font-size="14">40 %</text><path d="M80,297.0H740" stroke="#d8ddd5"/><text x="25" y="302.0" font-size="14">60 %</text><path d="M80,261.0H740" stroke="#d8ddd5"/><text x="25" y="266.0" font-size="14">80 %</text><path d="M80,225.0H740" stroke="#d8ddd5"/><text x="25" y="230.0" font-size="14">100 %</text><path d="M80,189.0H740" stroke="#d8ddd5"/><text x="25" y="194.0" font-size="14">120 %</text><path d="M80,225H740" stroke="#87644d" stroke-dasharray="5 5"/><rect x="160" y="199.58399999999997" width="80" height="205.41600000000003" fill="#476654"/><text x="200" y="189.58399999999997" text-anchor="middle" font-size="17" font-weight="bold">114,12 %</text><rect x="265" y="314.028" width="80" height="90.97199999999998" fill="#842f38"/><text x="305" y="304.028" text-anchor="middle" font-size="17" font-weight="bold">50,54 %</text><text x="252" y="437" text-anchor="middle" font-size="18">2024</text><rect x="480" y="211.03199999999998" width="80" height="193.96800000000002" fill="#476654"/><text x="520" y="201.03199999999998" text-anchor="middle" font-size="17" font-weight="bold">107,76 %</text><rect x="585" y="324.792" width="80" height="80.20800000000003" fill="#842f38"/><text x="625" y="314.792" text-anchor="middle" font-size="17" font-weight="bold">44,56 %</text><text x="572" y="437" text-anchor="middle" font-size="18">2025</text><text x="40" y="468" font-size="13">Sources : Cour des comptes, rapports 2024 (tableau 12) et 2025 (tableau 2).</text><text x="40" y="491" font-size="13">100 % = crédits de référence ; budgets différents selon l’exercice.</text><text x="40" y="513" font-size="12">Graphique original ELIKYAPEDIA · 10 novembre 2026 · Valeurs détaillées dans le texte.</text></svg>